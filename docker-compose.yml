services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: drdoc-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage    # named volume, not a path
    restart: unless-stopped

volumes:
  qdrant_data:



